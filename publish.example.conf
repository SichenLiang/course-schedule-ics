# course-schedule-ics -- example publishing settings
#
# Copy to publish.conf (gitignored) and edit. Only ./deploy.sh and the scripts
# under launchd/ read this; the parser itself never does.
#
# This file is sourced by /bin/bash, so it is shell syntax: no space around =,
# and quote anything with spaces in it. Nothing here should ever hold a
# password or a token -- pushing is done by whatever credentials `git` and `gh`
# already have.
#
# Every setting can also be given in the environment, which wins over this
# file:  MIN_EVENTS=1 ./deploy.sh


# --- what to build --------------------------------------------------------

# The parser's config file (see config.example.ini). Relative paths are
# resolved against the repository root.
CONFIG="course-schedule.ini"

# Where the parser writes state.json and schedule.ics. Gitignored.
WORK_DIR="live"

# Extra flags handed to the parser. Set it to --offline to exercise this whole
# pipeline against recorded pages without touching the course site -- worth
# doing once before you let it run on a schedule.
PARSER_ARGS=""


# --- where to publish it --------------------------------------------------

# A local clone of a SEPARATE, public repository that serves the calendar --
# GitHub Pages, or anything else that serves a file over HTTPS. Required.
#
# It is a separate repo on purpose. This one holds your state.json and, if you
# recorded any, copies of your course pages; the public one holds one .ics and
# nothing else.
PUB_REPO="$HOME/src/my-course-calendar"

# Branch to commit and push.
PUB_BRANCH="main"

# The only files allowed to exist or change in the public repo. Anything else
# appearing there stops the publish; it is the last line of defence against
# something private being committed by accident.
ALLOWED_FILES="README.md schedule.ics"

# Where the published file ends up. Leave EMPTY to skip the after-push check.
# When set, deploy.sh polls it until the bytes there match what it pushed, so
# "it said it published" and "it is actually published" are the same claim.
PUBLIC_URL=""


# --- the gates ------------------------------------------------------------

# Refuse to publish fewer than this many events. A course page that quietly
# turns into a login wall parses to almost nothing, and "almost nothing" is
# indistinguishable from "the semester ended" without a floor.
MIN_EVENTS=10

# Refuse a fall of more than this percentage against what is already published.
SHRINK_PCT=25

# Seconds to wait for the published URL to serve the new bytes. GitHub Pages
# usually takes 30-60s.
VERIFY_TIMEOUT=180

# Extra hostnames allowed to appear inside the .ics, beyond the hosts of the
# pages named in CONFIG. Space-separated. Usually empty.
EXTRA_ALLOWED_HOSTS=""

# Extra case-insensitive regexes that must NOT appear in the published .ics.
# One per line. This is where institution-specific words belong -- the name of
# your LMS, a student-ID shape, anything that would identify you or a
# classmate if it leaked into a lecture title.
#
# Example:
#   FORBIDDEN_PATTERNS='name-of-your-lms
#   [a-z]{2}[0-9]{4,}@
#   student\s+id'
FORBIDDEN_PATTERNS=""


# --- scheduling (launchd/, macOS only) ------------------------------------

# The LaunchAgent's label. It must be unique on your machine, and install.sh
# and uninstall.sh touch this label and nothing else in ~/Library/LaunchAgents.
LAUNCHD_LABEL="local.course-schedule-ics.publish"

# Hours of the day to run, space-separated, 0-23.
LAUNCHD_HOURS="1 7 13 19"

# PATH given to the scheduled job. launchd does not inherit your shell's, so
# without this the job cannot find git, gh or python3.
LAUNCHD_PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin"

# Rotate the log at this size, in bytes.
LOG_MAX=1048576

# A silence longer than this many hours means a scheduled window was missed.
GAP_HOURS=30

# How stale the last success may get before status.sh calls the job unhealthy.
STALE_HOURS=26
