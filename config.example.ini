# course-schedule-ics -- example configuration
#
# Copy this file to course-schedule.ini (which the tool looks for in the
# working directory), edit it, and run:
#
#     python3 -m courseics --out-dir live
#
# Nothing about any course is built into the program; everything it needs to
# know is here. The course below is invented -- replace every value.
#
# Comments start with # or ;. Values are not quoted: write
#     name = Robot Motion and Planning
# not
#     name = "Robot Motion and Planning"


[calendar]

# The calendar's display name (X-WR-CALNAME). Required.
name = EXAMPLE 1234 -- Introduction to Examples

# IANA time zone the page's wall-clock deadlines are written in.
#
# Leave it EMPTY for floating local time, which means "23:59 wherever the
# reader happens to be" -- fine for a course you attend in person, wrong the
# moment you travel. Naming a zone pins the deadline to one instant, and the
# .ics carries the matching VTIMEZONE so the client does not have to guess.
#
# Only zones this tool ships a VTIMEZONE for are accepted, and it will tell you
# the list if you name one it does not have:
#   America/New_York  America/Chicago  America/Denver  America/Los_Angeles
#   Europe/London  Europe/Dublin  Europe/Paris  Europe/Berlin  Europe/Madrid
#   Europe/Rome  UTC  Asia/Shanghai  Asia/Hong_Kong  Asia/Singapore
#   Asia/Taipei  Asia/Tokyo  Asia/Seoul  Asia/Kolkata  Asia/Dubai
#
# A page that writes "11:59PM EST" almost always means "our local wall clock",
# not literally UTC-5 -- a September deadline in New York is EDT. Name the
# zone, not the offset, and both halves of the semester come out right.
timezone = America/New_York

# Applied to a deadline the page gives no clock time for. 24-hour HH:MM.
default_due_time = 23:59

# Reminder lead time, in days before the event. 0 means at the event itself.
alarm_days_before = 1


[semester]

# Required, and there is deliberately no default.
#
# Course pages routinely print a deadline as "Due Sep. 13" with no year. The
# tool refuses to guess "the next September 13 from today", because the same
# page would then parse differently depending on the day you ran it. Instead
# this one number pins the whole academic year:
#
#     August-December  ->  fall_year
#     January-May      ->  fall_year + 1
#
# A year printed on the page always wins over this; when the two disagree the
# event is still published, flagged [?].
#
# Set it to the year the academic year STARTS -- for a spring 2027 course that
# is 2026. June and July belong to neither half: a date in them is dropped and
# reported, on the grounds that it is far more likely to be a misparse than a
# class meeting.
fall_year = 2026


[fetch]

# Optional. An address a site operator can reach you at, added to the
# User-Agent. Not sent anywhere else. Leave it empty and the User-Agent still
# names the tool and links to the project.
contact =

# Seconds to wait between two requests. Be polite; the default is one second.
min_request_interval = 1.0

# Per-request timeout, in seconds.
timeout = 30


[health]

# The run fails rather than publishing when the number of records collapses
# against the last successful run -- 0.5 means "refuse a fall of more than 50%".
#
# Both guards exist because they answer different questions. A page carrying
# every deadline but only a quarter of the records can lose ALL of them without
# moving the total far enough to trip the global threshold.
max_shrink_ratio = 0.5
max_source_shrink_ratio = 0.5


# --- the pages to fetch ---------------------------------------------------
#
# One [source:LABEL] section per page. The label is yours; it appears in
# messages. At least one is required.
#
#   url      the page. http(s) only.
#   kind     what a date on this page means when nothing on the line says
#            otherwise. One of:
#              lecture         a class meeting        (all-day event)
#              assignment_out  a release date         (all-day, "ASSIGNED: ")
#              assignment_due  a deadline             (timed, "DUE: ")
#              unknown         no page convention     (all-day, no prefix)
#            A "Due"/"Deadline"/"Submit by" cue next to a date overrides this
#            and makes that one date a deadline, whatever the page's default.
#   fixture  optional; a recorded copy of the page, used by --offline. Paths
#            are relative to THIS file.

[source:lectures]
url = https://sites.google.com/example.edu/example-course/lectures
kind = lecture

[source:assignments]
# On a page that says "assignments are handed out on the date at the left and
# are due on the date at the right", the left-hand date is a release date --
# so the page's default kind is assignment_out, and only the cued dates become
# deadlines.
url = https://sites.google.com/example.edu/example-course/assignments
kind = assignment_out
