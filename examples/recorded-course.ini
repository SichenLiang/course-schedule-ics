# The course the two recorded pages in tests/fixtures/ were captured from.
#
# This is the config the test suite runs against, and the one that makes the
# offline demo work with no network at all:
#
#     python3 -m courseics --config examples/recorded-course.ini \
#                          --offline --out-dir out --list
#
# It is here to be READ as a worked example and to be replayed. It is not a
# template -- copy config.example.ini instead, which is annotated and does not
# point at somebody else's course.
#
# The recordings are the real pages, kept verbatim except that the instructor's
# name and email address in the page footer were replaced with a placeholder.

[calendar]
name = ROB-UY 3303
timezone = America/New_York
default_due_time = 23:59
alarm_days_before = 1

[semester]
fall_year = 2026

[fetch]
contact =
min_request_interval = 1.0
timeout = 30

[health]
max_shrink_ratio = 0.5
max_source_shrink_ratio = 0.5

[source:lectures]
url = https://sites.google.com/nyu.edu/rob-uy3303/lectures
kind = lecture
fixture = ../tests/fixtures/lectures.html

[source:assignments]
# The page states its own convention -- "Assignments begin on the dates listed
# left, and are due ... on the day listed below right" -- so an un-cued date
# here is the day the assignment is handed out, not the deadline.
url = https://sites.google.com/nyu.edu/rob-uy3303/assignments
kind = assignment_out
fixture = ../tests/fixtures/assignments.html
